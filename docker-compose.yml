services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  client:
    build:
      context: ./bookchetna
      dockerfile: Dockerfile
      target: development
    container_name: leaflend-app
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PRIVATE_POLL_INTERVAL_MS=1000
    env_file:
      - ./bookchetna/.env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - ./bookchetna:/app
      - /app/node_modules
    # ws:
    # build: ./ws
    # container_name: ws-server
    # ports:
    #   - "5000:5000"
    # depends_on:
    #   - db
    # networks:
    #   - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:



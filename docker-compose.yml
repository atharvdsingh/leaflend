services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db_chat:
    image: postgres:15-alpine
    container_name: postgres-chat
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chatsecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    networks:
      - app-network
    volumes:
      - postgres_data_chat:/var/lib/postgresql/data
  client:
    build:
      context: ./bookchetna
      dockerfile: Dockerfile
      target: development
    container_name: leaflend-app
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PRIVATE_POLL_INTERVAL_MS=1000
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/postgres
    env_file:
      - ./bookchetna/.env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - ./bookchetna:/app
      - /app/node_modules
  ws:
    build:
      context: ./ws
      dockerfile: Dockerfile
      target: development
    container_name: ws-server
    env_file:
      - ./ws/.env
    ports:
      - "5000:5000"
    depends_on:
      - db_chat
    networks:
      - app-network
    volumes:
      - ./ws:/app

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_data_chat:


